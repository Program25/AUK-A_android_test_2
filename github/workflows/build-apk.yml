name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: node scripts/build-apk.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: AUK-A-apk
          path: dist/*.apk
